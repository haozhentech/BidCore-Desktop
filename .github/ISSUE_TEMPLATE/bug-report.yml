name: 问题反馈
description: 报告使用过程中遇到的问题
body:
  - type: markdown
    attributes:
      value: 请仅提供脱敏信息。不要上传 API Key、客户原件或未公开投标材料。安全问题请使用 Security 中的私密报告入口。
  - type: input
    id: version
    attributes:
      label: 软件版本与 Windows 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 操作步骤
      description: 从哪个页面开始，做了哪些操作？
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏截图或日志（可选）
